[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbt-core"
version = "0.1.0"
description = "Barbell-plate detection, tracking and velocity analysis for VBT"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "ultralytics",
]

[project.optional-dependencies]
webapp = ["flask"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["vbt_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]   # so tests can `import webapp.app` (webapp isn't pip-installed)
filterwarnings = ["ignore::DeprecationWarning"]
